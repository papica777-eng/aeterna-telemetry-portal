<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AETERNA SYSTEMDEF — Сваляне</title>
  
  <!-- 1. Директен мета-рефреш за мигновено браузърно сваляне -->
  <meta http-equiv="refresh" content="0; url=/AETERNA_SYSTEMDEF_INSTALLER.apk">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #03060c;
      --card: rgba(10, 18, 32, 0.94);
      --border: rgba(0, 240, 255, 0.28);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.35);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.12) 0%, transparent 55%),
        linear-gradient(180deg, #03060c 0%, #060d1a 100%);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.9), 0 0 35px var(--cyan-glow);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }

    .spinner-box {
      position: relative;
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
    }

    .spinner {
      width: 100%;
      height: 100%;
      border: 4px solid rgba(0, 240, 255, 0.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    .icon-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      color: var(--cyan);
    }

    p {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #00f0ff 0%, #0077ff 100%);
      color: #03060c;
      font-weight: 800;
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
      margin-top: 22px;
      display: inline-block;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner-box">
      <div class="spinner"></div>
      <div class="icon-inner">⚡</div>
    </div>
    <h1>Свалянето стартира...</h1>
    <p>Ако изтеглянето на инсталатора не започне автоматично до 2 секунди, натиснете бутона долу:</p>
    
    <a id="downloadBtn" href="/AETERNA_SYSTEMDEF_INSTALLER.apk" class="btn" download="AETERNA_SYSTEMDEF_INSTALLER.apk">
      <span>⬇️</span> СВАЛИ ПРИЛОЖЕНИЕТО (APK)
    </a>

    <div class="badge">AETERNA // PAAS.WEBSITE • SECURE NODE</div>
  </div>

  <script>
    const apkUrl = "/AETERNA_SYSTEMDEF_INSTALLER.apk";
    const ua = navigator.userAgent || "";

    // In-App Browser Escape (Viber, Instagram, Facebook, Messenger, TikTok, Line, WeChat)
    const isInApp = /FBAN|FBAV|Instagram|Viber|Line|Snapchat|WeChat/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    if (isInApp && isAndroid) {
      // Форсирано отваряне в пълен Google Chrome, за да се заобиколи блокажът на сваляне в in-app браузърите
      window.location.href = "intent://" + window.location.host + apkUrl + "#Intent;scheme=https;package=com.android.chrome;end";
    } else {
      // 2. Програмен синтетичен клик с download атрибут за мигновен старт
      const link = document.createElement("a");
      link.href = apkUrl;
      link.setAttribute("download", "AETERNA_SYSTEMDEF_INSTALLER.apk");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
